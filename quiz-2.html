<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 Quiz: JavaScript Foundations | Nexus Academy</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-bg: #0f172a; 
            --card-bg: #1e293b; 
            --accent-color: #0d6efd; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        body {
            background-color: var(--primary-bg); 
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .progress-indicator { font-weight: 600; color: var(--accent-color); font-size: 1.1rem; }
        
        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .options-grid {
            display: grid;
            gap: 15px;
        }

        .option-btn {
            background-color: rgba(255,255,255,0.03);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            padding: 18px 20px;
            border-radius: 10px;
            font-size: 1.05rem;
            text-align: left;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            background-color: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }

        .option-btn.selected {
            background-color: rgba(13, 110, 253, 0.1);
            border-color: var(--accent-color);
        }

        .option-letter {
            background-color: rgba(255,255,255,0.1);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            margin-right: 15px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .option-btn.selected .option-letter { background-color: var(--accent-color); }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .results-screen { display: none; text-align: center; }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            margin: 0 auto 30px auto;
            border: 8px solid var(--accent-color);
            background-color: rgba(13, 110, 253, 0.1);
        }

        .review-list { text-align: left; margin-top: 40px; }
        .review-item {
            background-color: rgba(255,255,255,0.02);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--danger-color);
        }
        .review-item.correct { border-left-color: var(--success-color); }
        .review-question { font-weight: 600; margin-bottom: 10px; font-size: 1.1rem; }
        .review-answer { font-size: 0.95rem; color: var(--text-muted); }
        .review-answer span { font-weight: 600; color: var(--text-main); }
    </style>
</head>
<body>

    <div class="quiz-container">
        
        <div id="quizUI">
            <div class="header-bar">
                <div>
                    <h5 class="mb-0 fw-bold text-uppercase" style="letter-spacing: 1px; color: #60a5fa;">Week 2 Quiz</h5>
                    <small class="text-muted">JavaScript Foundations</small>
                </div>
                <div class="progress-indicator">
                    Question <span id="currentQ">1</span> of <span id="totalQ">20</span>
                </div>
            </div>

            <div class="question-text" id="questionText">Loading question...</div>

            <div class="options-grid" id="optionsGrid">
                </div>

            <div class="controls">
                <button class="btn btn-outline-secondary px-4 py-2 fw-bold text-light" id="btnClose" onclick="closeQuiz()">Close Quiz</button>
                <button class="btn btn-primary px-5 py-2 fw-bold shadow-sm" id="btnNext" onclick="nextQuestion()" disabled>Next Question <i class="bi bi-arrow-right ms-2"></i></button>
            </div>
        </div>

        <div id="resultsUI" class="results-screen">
            <h2 class="display-6 fw-bold mb-4">Quiz Completed!</h2>
            
            <div class="score-circle" id="scoreDisplay">0%</div>
            
            <h4 class="mb-3" id="feedbackMessage">Good Effort!</h4>
            <p class="text-muted mb-5" id="scoreSubtext">You scored X out of Y correct.</p>

            <div class="d-flex justify-content-center gap-3" id="actionButtons">
                </div>

            <div class="review-list" id="reviewContainer">
                </div>
        </div>

    </div>

    <script>
        // 20 Questions based on Lecture 4, 5, and 6
        const quizData = [
            {
                question: "Which keyword is used to declare a variable whose value should never change?",
                options: ["const", "let", "var", "static"],
                correct: 0
            },
            {
                question: "What specific data type is the value 'true'?",
                options: ["String", "Number", "Array", "Boolean"],
                correct: 3
            },
            {
                question: "How do you correctly write a String in JavaScript?",
                options: ["Wrapped in square brackets []", "Wrapped in quotation marks \"\"", "Wrapped in parentheses ()", "By capitalizing the first letter"],
                correct: 1
            },
            {
                question: "If you add two strings together, like \"10\" + \"10\", what will JavaScript output?",
                options: ["20", "An Error", "\"1010\"", "undefined"],
                correct: 2
            },
            {
                question: "What does DOM stand for?",
                options: ["Document Object Model", "Data Output Method", "Digital Object Maker", "Document Orientation Module"],
                correct: 0
            },
            {
                question: "Which method is used to find a specific HTML element by its ID?",
                options: ["querySelectorAll()", "document.getElementById()", "selectId()", "grabElement()"],
                correct: 1
            },
            {
                question: "What is the primary purpose of an if/else statement?",
                options: ["To style elements", "To perform mathematical calculations", "To make decisions based on conditions (Flow Control)", "To repeat an action 100 times"],
                correct: 2
            },
            {
                question: "At what number do JavaScript Arrays start counting (their index)?",
                options: ["1", "-1", "10", "0"],
                correct: 3
            },
            {
                question: "Which array method is used to add a new item to the end of a list?",
                options: [".add()", ".push()", ".insert()", ".append()"],
                correct: 1
            },
            {
                question: "What do we call a reusable block of code that performs one specific job?",
                options: ["A Function", "An Array", "A Loop", "An Object"],
                correct: 0
            },
            {
                question: "What keyword does a function use to send a value back to where it was called?",
                options: ["export", "send", "output", "return"],
                correct: 3
            },
            {
                question: "Which tool is best for repeating the exact same action a specific number of times?",
                options: ["if statement", "for loop", "const variable", "DOM element"],
                correct: 1
            },
            {
                question: "What concept determines where a variable can be seen or used in your code?",
                options: ["Scope", "DOM", "Events", "Nodes"],
                correct: 0
            },
            {
                question: "A variable created INSIDE a function is known as having what kind of scope?",
                options: ["Global Scope", "Universal Scope", "Local Scope", "Static Scope"],
                correct: 2
            },
            {
                question: "What method do we use to tell JavaScript to wait for a user action, like a button click?",
                options: ["onclick()", "addEventListener()", "listenEvent()", "appendChild()"],
                correct: 1
            },
            {
                question: "Which command creates a brand new HTML element purely in the computer's memory?",
                options: ["document.make()", "document.new()", "document.createElement()", "document.addNode()"],
                correct: 2
            },
            {
                question: "After creating a new element in memory, which command physically attaches it to the visible website tree?",
                options: ["insertHTML()", "appendChild()", "addNode()", "push()"],
                correct: 1
            },
            {
                question: "Why should you use 'let' instead of 'const' when creating a variable for a shopping cart total?",
                options: ["'let' executes faster", "Because the total value will change as items are added", "Because 'const' only holds text", "It is just a stylistic preference"],
                correct: 1
            },
            {
                question: "In the array `let colors = ['Red', 'Blue', 'Green'];`, what is the index position of 'Blue'?",
                options: ["0", "1", "2", "3"],
                correct: 1
            },
            {
                question: "What happens if code OUTSIDE a function tries to read a Local variable created INSIDE that function?",
                options: ["It reads it successfully", "It returns the word 'undefined'", "It automatically converts it to Global", "It results in an Error because the variable is private to the function"],
                correct: 3
            }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const questionEl = document.getElementById('questionText');
        const optionsGrid = document.getElementById('optionsGrid');
        const btnNext = document.getElementById('btnNext');
        const currentQEl = document.getElementById('currentQ');
        const totalQEl = document.getElementById('totalQ');

        totalQEl.innerText = quizData.length;

        function loadQuestion() {
            const currentQ = quizData[currentQuestionIndex];
            questionEl.innerText = currentQ.question;
            currentQEl.innerText = currentQuestionIndex + 1;
            
            optionsGrid.innerHTML = ''; // Clear previous
            btnNext.disabled = userAnswers[currentQuestionIndex] === null;

            if(currentQuestionIndex === quizData.length - 1) {
                btnNext.innerHTML = 'Finish Quiz <i class="bi bi-check2-circle ms-2"></i>';
                btnNext.classList.replace('btn-primary', 'btn-success');
            } else {
                btnNext.innerHTML = 'Next Question <i class="bi bi-arrow-right ms-2"></i>';
                btnNext.classList.replace('btn-success', 'btn-primary');
            }

            const letters = ['A', 'B', 'C', 'D'];
            
            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if(userAnswers[currentQuestionIndex] === index) btn.classList.add('selected');
                
                btn.innerHTML = `<div class="option-letter">${letters[index]}</div> <div>${opt}</div>`;
                btn.onclick = () => selectOption(index);
                optionsGrid.appendChild(btn);
            });
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            const buttons = optionsGrid.children;
            for(let i=0; i<buttons.length; i++) {
                buttons[i].classList.remove('selected');
            }
            buttons[index].classList.add('selected');
            btnNext.disabled = false;
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quizUI').style.display = 'none';
            document.getElementById('resultsUI').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            let score = 0;
            const reviewHtml = [];

            quizData.forEach((q, i) => {
                const isCorrect = userAnswers[i] === q.correct;
                if (isCorrect) score++;

                const statusIcon = isCorrect 
                    ? '<i class="bi bi-check-circle-fill text-success fs-5 me-2"></i>' 
                    : '<i class="bi bi-x-circle-fill text-danger fs-5 me-2"></i>';

                reviewHtml.push(`
                    <div class="review-item ${isCorrect ? 'correct' : ''}">
                        <div class="review-question">${statusIcon} Q${i+1}: ${q.question}</div>
                        <div class="review-answer">
                            Your answer: <span>${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span>
                            ${!isCorrect ? `<br>Correct answer: <span class="text-success">${q.options[q.correct]}</span>` : ''}
                        </div>
                    </div>
                `);
            });

            const percentage = Math.round((score / quizData.length) * 100);
            
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.innerText = percentage + '%';
            
            if (percentage >= 80) {
                scoreDisplay.style.borderColor = 'var(--success-color)';
                scoreDisplay.style.color = 'var(--success-color)';
                document.getElementById('feedbackMessage').innerText = "Excellent Work!";
            } else if (percentage >= 60) {
                scoreDisplay.style.borderColor = '#eab308'; // Yellow
                scoreDisplay.style.color = '#eab308';
                document.getElementById('feedbackMessage').innerText = "Good Effort, but keep reviewing.";
            } else {
                scoreDisplay.style.borderColor = 'var(--danger-color)';
                scoreDisplay.style.color = 'var(--danger-color)';
                document.getElementById('feedbackMessage').innerText = "Module Review Recommended.";
            }

            document.getElementById('scoreSubtext').innerText = `You scored ${score} out of ${quizData.length} correct.`;
            document.getElementById('reviewContainer').innerHTML = reviewHtml.join('');

            const actionContainer = document.getElementById('actionButtons');
            if (percentage >= 80) {
                actionContainer.innerHTML = `<button class="btn btn-success btn-lg px-4 rounded-pill fw-bold shadow" onclick="takeNextStep()">
                                              Continue to Module 3 <i class="bi bi-arrow-right-circle ms-2"></i>
                                           </button>`;
            } else {
                actionContainer.innerHTML = `<button class="btn btn-primary btn-lg px-4 rounded-pill fw-bold shadow" onclick="retryQuiz()">
                                              <i class="bi bi-arrow-clockwise me-2"></i> Retry Quiz
                                           </button>`;
            }
        }

        function retryQuiz() {
            currentQuestionIndex = 0;
            userAnswers = new Array(quizData.length).fill(null);
            
            document.getElementById('resultsUI').style.display = 'none';
            document.getElementById('quizUI').style.display = 'block';
            
            loadQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function takeNextStep() {
            if (window.self !== window.top) {
                parent.document.querySelector('.btn-close').click();
            } else {
                window.location.href = "dashboard.html"; 
            }
        }

        function closeQuiz() {
            if (window.self !== window.top) {
                parent.document.querySelector('.btn-close').click();
            } else {
                window.location.href = "dashboard.html"; 
            }
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
